name: mission-control
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/mission.sqlite
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      DIRECTOR_USERNAME: ${DIRECTOR_USERNAME:-flight-director}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-demo-director}
    volumes:
      - mission-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 4s
      retries: 12
  test:
    profiles: ["test"]
    image: mission-control-tests:local
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    network_mode: none
    environment:
      LLM_PROVIDER: fake
      OPENAI_API_KEY: ""
      DATABASE_URL: sqlite+aiosqlite:////tmp/mission-test.sqlite
volumes:
  mission-data:
