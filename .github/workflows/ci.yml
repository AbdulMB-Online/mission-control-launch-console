name: Required checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests and production build
        run: make test
      - name: Compose startup
        run: make up
      - name: Deployment health
        run: curl --fail --silent --show-error http://localhost:8080/healthz
      - name: Cleanup
        if: always()
        run: make down
